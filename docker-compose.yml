version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_drainos_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_drainos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_drainos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
    container_name: ai_drainos_ai
    restart: always
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5001/predict\")' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: ai_drainos_server
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_drainos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PORT: ${PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:5001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    command: sh -c "node scripts/dbInit.js && npm start"
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    container_name: ai_drainos_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
